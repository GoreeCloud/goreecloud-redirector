<!doctype html>
<html lang="en" data-glaze-ui="1.0.0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>GoreeCloud Redirector</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup-page">
  <main class="popup-shell" aria-labelledby="title">
    <header class="brand-row">
      <div>
        <p class="eyebrow">GoreeCloud</p>
        <h1 id="title">Redirector</h1>
      </div>
      <img class="product-mark" src="icons/redirector.svg" alt="" width="32" height="32">
    </header>

    <section class="glass-card compact-card" aria-labelledby="keep-title">
      <div class="rule-copy">
        <p class="rule-label" id="keep-title">Google Keep</p>
        <p class="rule-target">→ GoreeCloud Memos</p>
        <p class="rule-host">memos.goreecloud.com</p>
      </div>
      <label class="switch" aria-label="Enable Google Keep redirect">
        <input id="builtin-toggle" type="checkbox">
        <span class="slider"></span>
      </label>
    </section>

    <p id="status" class="status-text" role="status">Checking redirect…</p>

    <button id="manage" class="primary-button" type="button">Manage redirects</button>
    <p class="privacy-note">No analytics. No remote code. Redirect rules are evaluated by Firefox.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
